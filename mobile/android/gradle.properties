org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# The project lives on a different drive (D:) than the Gradle/pub caches (C:). Kotlin's
# relocatable incremental cache can't compute a relative path across drive roots on Windows
# and crashes the compile daemon ("this and base files have different roots"). Incremental
# compilation isn't needed for CI/one-shot builds, so just turn it off.
kotlin.incremental=false
